# Local development only. This Compose example uses a Docker-mounted secret file.
# Kubernetes deployments demonstrate Vault Agent injection separately.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      REDIS_ADDR: "redis:6379"
      VAULT_SECRET_FILE: "/run/secrets/trc20_webhook_key"
    secrets:
      - trc20_webhook_key
    depends_on:
      - redis
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional Vault development server; not connected to gateway by default.
  vault:
    profiles: ["vault-dev"]
    image: hashicorp/vault:1.15
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK

secrets:
  trc20_webhook_key:
    file: ./local-secrets/webhook-secret
