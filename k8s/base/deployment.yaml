apiVersion: apps/v1
kind: Deployment
metadata:
  name: trc20-gateway
  namespace: fintech-gateway
  labels:
    app: trc20-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trc20-gateway
  template:
    metadata:
      labels:
        app: trc20-gateway
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "trc20-gateway-role"
        vault.hashicorp.com/agent-inject-secret-webhook-secret: "secret/data/trc20/gateway"
        vault.hashicorp.com/agent-inject-template-webhook-secret: |
          {{- with secret "secret/data/trc20/gateway" -}}
          {{ .Data.data.webhook_secret }}
          {{- end -}}
    spec:
      serviceAccountName: trc20-gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: trc20-gateway@sha256:7b3a9c5c8f6a3b2b1d9e8f7a6c5b4d3e2f1a0c9b8d7e6f5a4b3c2d1e0f9a8b7c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_ADDR
              value: "redis-service.fintech-gateway.svc.cluster.local:6379"
            - name: VAULT_SECRET_FILE
              value: "/vault/secrets/webhook-secret"
