apiVersion: apps/v1
kind: Deployment
metadata:
  name: trc20-gateway
  namespace: fintech-gateway
  labels:
    app: trc20-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trc20-gateway
  template:
    metadata:
      labels:
        app: trc20-gateway
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "trc20-gateway-role"
    spec:
      serviceAccountName: trc20-gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: trc20-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_ADDR
              value: "redis-service.fintech-gateway.svc.cluster.local:6379"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
---
apiVersion: v1
kind: Service
metadata:
  name: trc20-gateway-service
  namespace: fintech-gateway
spec:
  selector:
    app: trc20-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
