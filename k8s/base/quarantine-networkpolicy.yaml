apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-quarantined-pods
  namespace: fintech-gateway
spec:
  # Falco remediation applies this label to a compromised pod.
  podSelector:
    matchLabels:
      security.quarantine: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
