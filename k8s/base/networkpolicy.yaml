apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trc20-gateway-netpol
  namespace: fintech-gateway
spec:
  podSelector:
    matchLabels:
      app: trc20-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Sadece Ingress Controller'dan 8080 portuna gelen trafiğe izin ver
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # 1. Vault'a erişim (Port 8200)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    # 2. Redis'e erişim (Port 6379)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # 3. Kube-DNS / CoreDNS erişimi (Port 53)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
