name: Go unit tests and vet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests (with race detector)
        run: go test -race ./...
      - name: Static vet
        run: go vet ./...
      - name: Build container image
        run: docker build -t trc20-gateway:ci .
      - name: Validate local Compose definition
        run: |
          mkdir -p local-secrets
          printf '%s\n' 'test-only-ci-secret' > local-secrets/webhook-secret
          docker compose config --quiet
      - name: Integration smoke test with Docker Compose and Redis
        shell: bash
        run: |
          set -euo pipefail
          # Only a disposable CI test key; never reuse it.
          chmod 0444 local-secrets/webhook-secret
          docker compose up -d --build
          trap 'docker compose logs --no-color --tail=100; docker compose down --volumes --remove-orphans' EXIT
          python3 scripts/smoke_compose.py
